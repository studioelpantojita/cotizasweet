name: CotizaSweet quality

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-windows:
    name: Windows / Node 24 / Python 3.12 / .NET 10
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      PYTHONUTF8: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      RUN_BROWSER_E2E: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api-python/requirements.lock.txt
            requirements-qa.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install locked web dependencies
        working-directory: web
        run: npm ci

      - name: Install Python application and QA dependencies
        run: python -m pip install -r api-python/requirements.lock.txt -r requirements-qa.txt

      - name: Check installed Python compatibility
        run: python -m pip check

      - name: Audit npm dependencies (moderate and above fail)
        working-directory: web
        run: npm audit --audit-level=moderate

      - name: Audit Python lock file (any reported vulnerability fails)
        run: python -m pip_audit -r api-python/requirements.lock.txt --disable-pip --no-deps

      - name: Restore locked .NET dependencies and audit
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $projects = @('EA-Cotiza.slnx', 'tests/v2/dotnet-probe/FinancialProbe.csproj', 'tests/security_backend/DotnetSecurityChecks.csproj')
          foreach ($project in $projects) {
            dotnet restore $project --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Generate Next.js route types for clean checkouts
        working-directory: web
        run: npx --no-install next typegen

      - name: Type check web code
        working-directory: web
        run: npm run typecheck

      - name: Check generated shared contracts
        working-directory: web
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run catalog:contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- ../contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run web unit, catalog, presentation and security aggregate
        working-directory: web
        run: npm test

      - name: Build production web bundle
        working-directory: web
        run: npm run build

      - name: Generate PDF regression samples
        working-directory: web
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run test:pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:services:pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify generated PDF layout and text
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -c "from pathlib import Path; p=list(Path('tests/artifacts/pdf').glob('*.pdf')); assert len(p)>=11, f'Missing PDF regression samples: {len(p)}'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_pdf.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build .NET application and test probes
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($project in @('EA-Cotiza.slnx', 'tests/v2/dotnet-probe/FinancialProbe.csproj', 'tests/security_backend/DotnetSecurityChecks.csproj')) {
            dotnet build $project -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run Python catalog regression tests
        run: python tests/catalog_test.py

      - name: Run Python security and operational tests
        run: python -m pytest tests/security_backend tests/operations tests/dependencies -q --junitxml=tests/artifacts/python-tests.xml

      - name: Record supplemental official NuGet feed audit
        run: python scripts/audit_nuget.py

      - name: Run .NET input and security checks
        run: dotnet tests/security_backend/bin/Release/net10.0/DotnetSecurityChecks.dll

      - name: Verify financial parity, mutations, concurrency and SQLite durability
        run: python tests/v2/run_quality.py --node node --dotnet-probe tests/v2/dotnet-probe/bin/Release/net10.0/FinancialProbe.dll

      - name: Install isolated Chromium for browser tests
        working-directory: web
        run: npx --no-install playwright install chromium

      - name: Run integrated OIDC, API, smoke, regression and browser journeys
        run: python tests/integration.py --backend all

      - name: Smoke and bounded public load on the production build
        run: python tests/production_smoke.py

      # Only allowlisted synthetic results are uploaded, and only after success.
      # Session files, service logs, traces and callback URLs are never artifacts.
      - name: Keep synthetic QA evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cotizasweet-quality-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false
          path: |
            tests/artifacts/v2-quality.json
            tests/artifacts/unit-results.json
            tests/artifacts/nuget-audit.json
            tests/artifacts/integration-results.json
            tests/artifacts/production-smoke.json
            tests/artifacts/pdf-layout.json
            tests/artifacts/python-tests.xml
            tests/artifacts/pdf/*.pdf
            tests/artifacts/browser/results.json
            tests/artifacts/browser/cotizacion-qa.pdf
            tests/artifacts/browser/desktop.png
            tests/artifacts/browser/mobile.png
            tests/artifacts/browser/pdf-preview.png
